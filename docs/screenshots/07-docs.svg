<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="1280" height="800" fill="#f1f5f9"/>
  <rect width="1280" height="56" fill="#1e293b"/>
  <text x="28" y="35" fill="#fff" font-size="20" font-weight="700">Endo<tspan fill="#4f46e5">-DSL</tspan></text>
  <g font-size="14" fill="#cbd5e1"><text x="420" y="35">Início</text><text x="510" y="35">Estúdio</text><text x="600" y="35">Biblioteca</text><text x="710" y="35">Curadoria</text><text x="815" y="35">Relatórios</text><text x="920" y="35" fill="#fff" font-weight="600">Gramática</text></g>
  <text x="64" y="108" fill="#0f172a" font-size="30" font-weight="800">Gramática &amp; limites <tspan fill="#94a3b8" font-size="15" font-weight="400">RF01 · RF02 · RF06</tspan></text>
  <text x="64" y="142" fill="#0f172a" font-size="16" font-weight="700">Gramática formal (EBNF)</text>
  <rect x="64" y="156" width="700" height="380" rx="10" fill="#0d1626"/>
  <g font-family="'Courier New',monospace" font-size="12.5">
    <text x="84" y="186" fill="#94a3b8">(* Gramática formal da Endo-DSL — RF01, RF02 *)</text>
    <text x="84" y="212"><tspan fill="#c792ea">spec</tspan> = game_decl ;</text>
    <text x="84" y="234"><tspan fill="#c792ea">game_decl</tspan> = <tspan fill="#c3e88d">"game"</tspan> , string , <tspan fill="#c3e88d">"{"</tspan> , { game_member } , <tspan fill="#c3e88d">"}"</tspan> ;</text>
    <text x="84" y="256"><tspan fill="#c792ea">game_member</tspan> = metadata_block | objective_decl</text>
    <text x="180" y="276" fill="#cbd5e1">| mechanic_decl | loop_decl | narrative_decl ;</text>
    <text x="84" y="302"><tspan fill="#c792ea">mechanic_decl</tspan> = <tspan fill="#c3e88d">"mechanic"</tspan> , ident , <tspan fill="#c3e88d">"{"</tspan> , { mechanic_field } , <tspan fill="#c3e88d">"}"</tspan> ;</text>
    <text x="84" y="324"><tspan fill="#c792ea">mechanic_field</tspan> = <tspan fill="#c3e88d">"type"</tspan> , ":" , ident</text>
    <text x="200" y="344" fill="#cbd5e1">| <tspan fill="#c3e88d">"bloom"</tspan> , ":" , bloom</text>
    <text x="200" y="364" fill="#cbd5e1">| <tspan fill="#c3e88d">"addresses"</tspan> , ":" , ident_list | params_block ;</text>
    <text x="84" y="390"><tspan fill="#c792ea">loop_decl</tspan> = <tspan fill="#c3e88d">"loop"</tspan> , ident , <tspan fill="#c3e88d">"{"</tspan> , { loop_field } , <tspan fill="#c3e88d">"}"</tspan> ;</text>
    <text x="84" y="412"><tspan fill="#c792ea">transition</tspan> = ident , <tspan fill="#c3e88d">"-&gt;"</tspan> , ident ;</text>
    <text x="84" y="438" fill="#94a3b8">(* Bloom como construto de primeira classe — RF02 *)</text>
    <text x="84" y="460"><tspan fill="#c792ea">bloom</tspan> = <tspan fill="#ffcb6b">"Lembrar"</tspan> | <tspan fill="#ffcb6b">"Compreender"</tspan> | <tspan fill="#ffcb6b">"Aplicar"</tspan></text>
    <text x="200" y="480" fill="#cbd5e1">| <tspan fill="#ffcb6b">"Analisar"</tspan> | <tspan fill="#ffcb6b">"Avaliar"</tspan> | <tspan fill="#ffcb6b">"Criar"</tspan> ;</text>
    <text x="84" y="506"><tspan fill="#c792ea">ident</tspan> = letter , { letter | digit | "_" | "." } ;</text>
  </g>
  <!-- mechanic types -->
  <text x="800" y="142" fill="#0f172a" font-size="16" font-weight="700">Mecânicas e afinidade Bloom (RF04)</text>
  <rect x="800" y="156" width="416" height="240" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <g font-size="12.5" fill="#475569">
    <text x="820" y="184" fill="#0f172a" font-weight="600">quiz</text><rect x="980" y="172" width="56" height="18" rx="9" fill="#3b82f6"/><text x="1008" y="185" text-anchor="middle" fill="#fff" font-size="10">Lembrar</text>
    <text x="820" y="214" fill="#0f172a" font-weight="600">matching</text><rect x="980" y="202" width="80" height="18" rx="9" fill="#14b8a6"/><text x="1020" y="215" text-anchor="middle" fill="#fff" font-size="10">Compreender</text>
    <text x="820" y="244" fill="#0f172a" font-weight="600">sequencing</text><rect x="980" y="232" width="56" height="18" rx="9" fill="#22c55e"/><text x="1008" y="245" text-anchor="middle" fill="#fff" font-size="10">Aplicar</text>
    <text x="820" y="274" fill="#0f172a" font-weight="600">classification</text><rect x="980" y="262" width="58" height="18" rx="9" fill="#eab308"/><text x="1009" y="275" text-anchor="middle" fill="#1e293b" font-size="10">Analisar</text>
    <text x="820" y="304" fill="#0f172a" font-weight="600">comparison</text><rect x="980" y="292" width="54" height="18" rx="9" fill="#f97316"/><text x="1007" y="305" text-anchor="middle" fill="#fff" font-size="10">Avaliar</text>
    <text x="820" y="334" fill="#0f172a" font-weight="600">puzzle</text><rect x="980" y="322" width="44" height="18" rx="9" fill="#ef4444"/><text x="1002" y="335" text-anchor="middle" fill="#fff" font-size="10">Criar</text>
    <text x="820" y="368" fill="#94a3b8" font-size="11">Tipo de mecânica → níveis de Bloom recomendados</text>
  </g>
  <!-- limits cards -->
  <text x="64" y="582" fill="#0f172a" font-size="16" font-weight="700">Limites da formalização (RF06)</text>
  <rect x="64" y="600" width="376" height="160" rx="12" fill="#fff" stroke="#e2e8f0"/><rect x="64" y="600" width="376" height="6" rx="3" fill="#22c55e"/>
  <text x="84" y="638" fill="#166534" font-size="15" font-weight="700">Formalizados</text>
  <g font-size="12" fill="#475569"><text x="84" y="664">• Mecânicas (tipo enum verificável)</text><text x="84" y="686">• Objetivos pedagógicos rastreáveis</text><text x="84" y="708">• Níveis de Bloom (1ª classe)</text><text x="84" y="730">• Loops e ramificações (grafo)</text></g>
  <rect x="456" y="600" width="376" height="160" rx="12" fill="#fff" stroke="#e2e8f0"/><rect x="456" y="600" width="376" height="6" rx="3" fill="#eab308"/>
  <text x="476" y="638" fill="#854d0e" font-size="15" font-weight="700">Parcialmente</text>
  <g font-size="12" fill="#475569"><text x="476" y="664">• Coerência mecânica-objetivo</text><text x="476" y="686">• Conteúdo textual narrativo</text><text x="476" y="708">• Curva de dificuldade</text></g>
  <rect x="848" y="600" width="368" height="160" rx="12" fill="#fff" stroke="#e2e8f0"/><rect x="848" y="600" width="368" height="6" rx="3" fill="#ef4444"/>
  <text x="868" y="638" fill="#991b1b" font-size="15" font-weight="700">Controle humano</text>
  <g font-size="12" fill="#475569"><text x="868" y="664">• Engajamento percebido</text><text x="868" y="686">• Experiência do jogador (UX)</text><text x="868" y="708">• Tom narrativo e estética</text><text x="868" y="730">• Adequação cultural</text></g>
</svg>
