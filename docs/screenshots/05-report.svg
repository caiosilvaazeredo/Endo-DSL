  <text x="64" y="110" fill="#0f172a" font-size="30" font-weight="800">Relatório comparativo <tspan fill="#94a3b8" font-size="15" font-weight="400">RF24–RF26</tspan></text>
  <!-- summary stats -->
  <rect x="64" y="140" width="270" height="90" rx="12" fill="#fff" stroke="#e2e8f0"/><text x="84" y="186" fill="#4f46e5" font-size="32" font-weight="800">3.86</text><text x="84" y="212" fill="#64748b" font-size="13">automático (n=12)</text>
  <rect x="354" y="140" width="270" height="90" rx="12" fill="#fff" stroke="#e2e8f0"/><text x="374" y="186" fill="#0f172a" font-size="32" font-weight="800">4.12</text><text x="374" y="212" fill="#64748b" font-size="13">manual (n=9)</text>
  <rect x="644" y="140" width="270" height="90" rx="12" fill="#fff" stroke="#e2e8f0"/><text x="664" y="186" fill="#f97316" font-size="32" font-weight="800">−0.26</text><text x="664" y="212" fill="#64748b" font-size="13">diferença</text>
  <rect x="934" y="140" width="282" height="90" rx="12" fill="#fff" stroke="#e2e8f0"/><rect x="960" y="170" width="160" height="34" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="1040" y="192" text-anchor="middle" fill="#475569" font-size="13">⬇ CSV (RF25)</text>
  <rect x="64" y="246" width="1152" height="40" rx="8" fill="#eef2ff"/>
  <text x="80" y="271" fill="#3730a3" font-size="13">Protótipos automáticos atingem 94% da qualidade pedagógica média dos manuais, sem diferença significativa em endogeneidade.</text>
