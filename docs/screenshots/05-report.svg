  <text x="300" y="640" fill="#4f46e5" font-size="12">■ Automático</text><text x="680" y="640" fill="#22c55e" font-size="12">■ Manual</text>
  <text x="64" y="690" fill="#0f172a" font-size="16" font-weight="700">Por nível de Bloom</text>
  <g font-size="13" fill="#475569">
    <rect x="64" y="704" width="76" height="22" rx="11" fill="#eab308"/><text x="102" y="719" text-anchor="middle" fill="#1e293b" font-size="11">Analisar</text>
