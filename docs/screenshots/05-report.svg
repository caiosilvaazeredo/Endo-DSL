      <rect x="300" y="592" width="300" height="16" rx="4" fill="#e2e8f0"/><rect x="300" y="592" width="270" height="16" rx="4" fill="#4f46e5"/><text x="610" y="605" fill="#475569">4.50</text>
      <rect x="680" y="592" width="300" height="16" rx="4" fill="#e2e8f0"/><rect x="680" y="592" width="240" height="16" rx="4" fill="#22c55e"/><text x="990" y="605" fill="#475569">4.00</text>
      <text x="1060" y="605" fill="#22c55e">+0.50</text>
