      <rect x="300" y="512" width="300" height="16" rx="4" fill="#e2e8f0"/><rect x="300" y="512" width="240" height="16" rx="4" fill="#4f46e5"/><text x="610" y="525" fill="#475569">4.00</text>
      <rect x="680" y="512" width="300" height="16" rx="4" fill="#e2e8f0"/><rect x="680" y="512" width="246" height="16" rx="4" fill="#22c55e"/><text x="990" y="525" fill="#475569">4.10</text>
      <text x="1060" y="525" fill="#f97316">−0.10</text>
    </g>
    <g>
      <text x="64" y="564" fill="#475569">Potencial de engajamento</text>
      <rect x="300" y="552" width="300" height="16" rx="4" fill="#e2e8f0"/><rect x="300" y="552" width="210" height="16" rx="4" fill="#4f46e5"/><text x="610" y="565" fill="#475569">3.50</text>
      <rect x="680" y="552" width="300" height="16" rx="4" fill="#e2e8f0"/><rect x="680" y="552" width="234" height="16" rx="4" fill="#22c55e"/><text x="990" y="565" fill="#475569">3.90</text>
      <text x="1060" y="565" fill="#f97316">−0.40</text>
