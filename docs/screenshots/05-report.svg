      <rect x="300" y="352" width="300" height="16" rx="4" fill="#e2e8f0"/><rect x="300" y="352" width="234" height="16" rx="4" fill="#4f46e5"/><text x="610" y="365" fill="#475569">3.90</text>
      <rect x="680" y="352" width="300" height="16" rx="4" fill="#e2e8f0"/><rect x="680" y="352" width="252" height="16" rx="4" fill="#22c55e"/><text x="990" y="365" fill="#475569">4.20</text>
      <text x="1060" y="365" fill="#f97316">−0.30</text>
    </g>
    <g>
